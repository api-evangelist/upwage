description: Upwage is an AI interview platform that helps employers hire faster and
  more fairly with lower turnover. Its emotionally intelligent AI interviewer conducts
  24/7 multilingual candidate screening, scoring competencies consistently to reduce
  bias in high-volume hiring across retail, healthcare, logistics, and staffing, with
  ATS integrations including Ashby, Greenhouse, iCIMS, Lever, SmartRecruiters, and
  Workday. Founded by Diana Tsai and Greg Call and backed by Bloomberg Beta, Upwage
  publishes a SOC 2 Type 2 trust center with third-party bias audits, but no public
  developer API surface yet.
